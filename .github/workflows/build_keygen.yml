name: build_keygen

on:
  repository_dispatch:
    types: [keygen-tag-created]

jobs:
  process-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print received tag information
        run: |
          echo "Workflow in Repository B triggered by a tag in Repository A."
          echo "Tag Name: ${{ github.event.client_payload.tag_name }}"
          echo "Commit SHA: ${{ github.event.client_payload.sha }}"
          echo "Triggering Repository: ${{ github.event.client_payload.triggering_repo }}"

      - name: Example step using tag
        if: ${{ github.event.client_payload.tag_name != '' }}
        run: echo "Processing tag ${{ github.event.client_payload.tag_name }}"

      - name: Checkout code from triggering repository
        if: ${{ github.event.client_payload.triggering_repo != '' && github.event.client_payload.tag_name != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.triggering_repo }}
          ref: ${{ github.event.client_payload.tag_name }}
          token: ${{ secrets.GH_PAT }}
      - name: Login to Container Registry
        if: ${{ github.event.client_payload.tag_name != '' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login --username "${{ secrets.ACR_USERNAME }}" --password-stdin crpi-jxberuq6v6y3whx7.cn-hongkong.personal.cr.aliyuncs.com

      - name: Build and push Docker image
        if: ${{ github.event.client_payload.tag_name != '' }}
        run: |
          make docker_build
          make docker_push
