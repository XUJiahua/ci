name: build_hear_npm
env:
  DEBUG: napi:*
  # working folder and app name
  APP_NAME: hear-core
  MACOSX_DEPLOYMENT_TARGET: "10.13"
permissions:
  contents: write
  id-token: write
on:
  repository_dispatch:
    types: [build_hear_npm]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: DEBUG variables from github.event.client_payload
        run: |
          echo "tag: ${{ github.event.client_payload.tag }}"
          echo "sha: ${{ github.event.client_payload.sha }}"
          echo "ref: ${{ github.event.client_payload.ref }}"
  build:
    defaults:
      run:
        working-directory: ${{ env.APP_NAME }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # x86 macos: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
          # - host: macos-12
          #   name: darwin_x86_64_cpu
          #   target: x86_64-apple-darwin
          #   build: |
          #     uname -a
          #     sw_vers
          #     yarn build
          # fix: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.8\include\crt/host_config.h(153): fatal error C1189: #error:  -- unsupported Microsoft Visual Studio version! Only the versions between 2017 and 2022 (inclusive) are supported!
          # ref: https://github.com/ggerganov/whisper.cpp/commit/c55964c956d02fc7449b3d928d9a8e093cd475c3
          # - host: windows-2019
          #   name: windows_x86_64_cuda
          #   build: yarn build --features cuda
          #   target: x86_64-pc-windows-msvc
          #   cuda-toolkit: "11.8.0"
            # fixme: fatal error LNK1181: cannot open input file 'cublas.lib'
            # cuda-toolkit: '11.3.0'
          - host: windows-latest
            name: windows_x86_64_cpu
            build: yarn build
            target: x86_64-pc-windows-msvc
          - host: macos-14
            name: darwin_arm64_metal
            target: aarch64-apple-darwin
            build: |
              uname -a
              sw_vers
              yarn build --features metal
    name: stable - ${{ matrix.settings.name }} - node@18
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          token: ${{ secrets.GH_PAT }}
          submodules: true
          ref: ${{ github.event.client_payload.ref }}
      - name: Pull & update submodules recursively
        run: |
          git submodule update --init --recursive
          git submodule update --recursive --remote
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 20
          check-latest: true
          cache: yarn
          cache-dependency-path: ./${{ env.APP_NAME }}/yarn.lock
      # required for deno
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CUDA Toolkit on Windows
        if: ${{ matrix.settings.cuda-toolkit != '' && matrix.settings.cuda-toolkit != null }}
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: ${{ matrix.settings.cuda-toolkit }}
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          # 1.80.0 has issue with time-rs
          # toolchain: stable
          toolchain: 1.78.0
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.10.1
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Setup node x86
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        run: yarn config set supportedArchitectures.cpu "ia32"
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Setup node x86
        uses: actions/setup-node@v4
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        with:
          node-version: 20
          check-latest: true
          cache: yarn
          cache-dependency-path: ./${{ env.APP_NAME }}/yarn.lock
          architecture: x86
      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: "--user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build/${{ env.APP_NAME }}"
          run: ${{ matrix.settings.build }}
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      - name: Rename node addon on Windows for CUDA
        if: ${{ matrix.settings.cuda-toolkit != '' && matrix.settings.cuda-toolkit != null }}
        run: mv hear-core.win32-x64-msvc.node hear-core.win32-x64-msvc.node.cuda
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.name }}
          path: ${{ env.APP_NAME }}/${{ env.APP_NAME }}.*.node*
          if-no-files-found: error
  publish:
    defaults:
      run:
        working-directory: ${{ env.APP_NAME }}
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lwtlab/lwt-core
          token: ${{ secrets.GH_PAT }}
          submodules: true
          ref: ${{ github.event.client_payload.ref }}
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
          cache: yarn
          cache-dependency-path: ./${{ env.APP_NAME }}/yarn.lock
          registry-url: https://npm.pkg.github.com/
      - name: Install dependencies
        run: yarn install
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.APP_NAME }}/artifacts
      - name: Move artifacts
        run: yarn artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Pack packages
        run: bash pack.sh
        shell: bash
      - name: Setup ossutil
        uses: yizhoumo/setup-ossutil@v1
        with:
          endpoint: "oss-cn-shanghai.aliyuncs.com"
          access-key-id: ${{ secrets.OSS_ACCESS_KEY }}
          access-key-secret: ${{ secrets.OSS_SECRET_KEY }}
      - name: Upload to Oss
        shell: bash
        run: |
          if [ -z "${{ github.event.client_payload.tag }}" ]; then
            ossutil cp -r dist/ oss://lwt-dev/lwt-core/${{ env.APP_NAME }}/`date -u +%Y%m%d%H%M%S`-${{ github.event.client_payload.sha }}/
          else
            ossutil cp -r dist/ oss://lwt-dev/lwt-core/${{ env.APP_NAME }}/${{ github.event.client_payload.tag }}/
          fi
